<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Zwei-Faktor-Authentifizierung</title></head>

<p>Scanne den QR-Code oder gib den Schlüssel manuell ein.</p>
<div class="qr">
  <img src="data:image/png;base64,PLACEHOLDER" alt="QR">
</div>
<a class="otpauth-link" href="otpauth://totp/IServ:parent?secret=JBSWY3DPEHPK3PXP&amp;issuer=IServ&amp;algorithm=SHA1&amp;digits=6&amp;period=30">In App öffnen</a>
<p class="manual">Schlüssel: <code>JBSW Y3DP EHPK 3PXP</code></p>
<form name="confirm" method="post" action="" id="twofactor_confirm" hx-post="/iserv/auth/settings/twofactor/add/confirm" hx-target="#twofactor-content">

  <input type="text" name="confirm[_fake_username]" value="" autocomplete="off">

  <button type="button">Manuelle Eingabe</button>
