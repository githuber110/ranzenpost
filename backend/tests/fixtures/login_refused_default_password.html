<!doctype html>
<html lang="de-DE">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
  <div class="alert alert-danger" role="alert">Sie können sich nicht mit dem Standardpasswort, welches dem Accountnamen entspricht, aus dem Internet anmelden. Bitte ändern Sie Ihr Passwort im Schulnetz oder wenden Sie sich an die Administration, der Zugang ist aus dem Internet gesperrt.</div>
  <form id="login-form" method="post" action="/iserv/auth/login">
    <input type="text" id="username" name="_username" value="parent.one" required>

    <button type="submit">Anmelden</button>
  </form>
</body>
</html>
