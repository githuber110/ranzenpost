<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Sicherheit</title></head>
<body>
<div class="alert alert-danger">Das aktuelle Passwort ist falsch.</div>
<form id="password_change" method="post" action="/iserv/account/settings/security">
  <input type="hidden" name="password_change[_token]" value="csrf-password-token">
  <input type="password" name="password_change[current]" value="">
  <input type="password" name="password_change[new][first]" value="">
  <input type="password" name="password_change[new][second]" value="">
</form>
</body>
</html>
