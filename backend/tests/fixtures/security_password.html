<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Sicherheit</title></head>
<body>
<h1>Passwort ändern</h1>
<form id="password_change" method="post" action="/iserv/account/settings/security">
  <input type="hidden" name="password_change[_token]" value="csrf-password-token">
  <label>Aktuelles Passwort <input type="password" name="password_change[current]" value=""></label>
  <label>Neues Passwort <input type="password" name="password_change[new][first]" value=""></label>
  <label>Neues Passwort wiederholen <input type="password" name="password_change[new][second]" value=""></label>
  <button type="submit">Speichern</button>
</form>
</body>
</html>
