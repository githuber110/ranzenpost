<html>
<head>
<title>Elternbrief - IServ - school.example</title>
</head>
<body>
<div class="panel panel-default">
<div class="panel-body">
<div class="parent-letter-body top-border translatable-content editor-content">
<p>Liebe Eltern,</p>
<div class="alert alert-info">Bitte bis Freitag zurueckmelden.</div>
</div>
</div>
<div class="panel-body pt-0">
<form name="form" method="post" action="" class="form-horizontal" role="form">
<div class="form-group">
<textarea id="form_message" name="form[message]" class="form-control" required></textarea>
<div class="form-error-message">Dieser Wert sollte nicht leer sein.</div>
</div>
<div class="top-border">
<button type="submit" id="form_submit" name="form[submit]" class="btn-success btn btn-primary" confirmation-type="SEEN"><span class="glyphicon glyphicon-check"></span> Gelesen</button>
<a class="btn btn-default" href="/iserv/parentletter/parent/index">Abbrechen</a>
</div>
<input type="hidden" id="form__token" name="form[_token]" class="form-control" value="fixture-token-0002">
</form>
</div>
</div>
</body>
</html>
