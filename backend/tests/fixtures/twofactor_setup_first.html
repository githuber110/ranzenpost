<!doctype html>
<html lang="de-DE">
<head><meta charset="UTF-8"><title>Zwei-Faktor-Authentifizierung einrichten</title></head>
<body>
<h1>Zwei-Faktor-Authentifizierung einrichten</h1>
<div class="alert alert-info">Für Ihren Account ist die Zwei-Faktor-Authentifizierung verpflichtend. Bitte richten Sie sie jetzt ein, um fortzufahren.</div>
<div id="twofactor-content">
  <p>Scannen Sie den QR-Code mit Ihrer 2FA-App.</p>
  <div class="qr"><img src="data:image/png;base64,PLACEHOLDER" alt="QR"></div>
  <a class="otpauth-link" href="otpauth://totp/IServ:parent.one?secret=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ&amp;issuer=IServ&amp;algorithm=SHA1&amp;digits=6&amp;period=30">In App öffnen</a>
  <p class="manual">Schlüssel: <code>GEZD GNBV GY3T QOJQ GEZD GNBV GY3T QOJQ</code></p>
  <form name="confirm" method="post" action="" id="twofactor_confirm" hx-post="/iserv/auth/settings/twofactor/add/confirm" hx-target="#twofactor-content">
    <label>Bezeichnung <input type="text" name="confirm[name]" value=""></label>
    <label>Passwort * <input type="password" name="confirm[verification]" value=""></label>
    <input type="text" name="confirm[_fake_username]" value="" autocomplete="off">
    <label>2FA-Code * <input type="text" name="confirm[code]" value=""></label>
    <button type="submit" name="confirm[actions][submit]">Aktivieren</button>
    <input type="hidden" name="confirm[_token]" value="csrf-first-setup">
  </form>
</div>
</body>
</html>
