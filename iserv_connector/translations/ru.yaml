network:
  "8100/tcp": "Подписка на календарь (ICS). Пока порт не указан, календарь выключен. Если указать порт, адрес календаря станет доступен в домашней сети без пароля — ссылка и есть пароль. Никогда не пробрасывайте порт через роутер; для доступа извне используйте обратный прокси с HTTPS или VPN."
