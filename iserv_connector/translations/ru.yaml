network:
  "8100/tcp": "Подписка на календарь (ICS). Пока порт не указан, календарь выключен. Если указать порт, адрес календаря станет доступен в домашней сети без пароля. Сама ссылка и есть пароль. Никогда не пробрасывайте порт через роутер; для доступа извне используйте обратный прокси с HTTPS или VPN."
configuration:
  passphrase:
    name: Кодовая фраза
    description: Шифрует сохранённые данные входа и ключ двухфакторной аутентификации этой фразой вместо постоянного ключа на диске. Без неё любой, у кого есть копия резервной копии, может прочитать секреты.
