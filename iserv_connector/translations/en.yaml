network:
  "8100/tcp": "Calendar subscription (ICS). The calendar stays off while no port is set. Setting a port here makes the calendar address reachable on your home network without a password. The link itself is the password. Never forward it through your router; use a reverse proxy with HTTPS or a VPN for access from outside."
configuration:
  passphrase:
    name: Passphrase
    description: Encrypts the saved login and two-factor key with this phrase, instead of a fixed key on disk. Without it, anyone with a copy of a backup can read the secrets.
