network:
  "8100/tcp": "Takvim aboneliği (ICS). Port girilmediği sürece takvim kapalı kalır. Buraya bir port girmek, takvim adresini ev ağında parolasız erişilebilir yapar. Bağlantının kendisi paroladır. Yönlendiriciden dışarıya asla açmayın; dışarıdan erişim için HTTPS'li ters vekil sunucu veya VPN kullanın."
configuration:
  passphrase:
    name: Parola cümlesi
    description: Kayıtlı giriş bilgilerini ve iki adımlı doğrulama anahtarını sabit bir diskteki anahtar yerine bu cümleyle şifreler. Bu olmadan, bir yedeğin kopyasına erişen herkes gizli bilgileri okuyabilir.
