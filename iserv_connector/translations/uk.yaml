network:
  "8100/tcp": "Підписка на календар (ICS). Поки порт не вказано, календар вимкнений. Якщо вказати порт, адреса календаря стане доступною в домашній мережі без пароля — посилання і є паролем. Ніколи не прокидайте порт через роутер; для доступу ззовні використовуйте зворотний проксі з HTTPS або VPN."
