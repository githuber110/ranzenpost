network:
  "8100/tcp": "Підписка на календар (ICS). Поки порт не вказано, календар вимкнений. Якщо вказати порт, адреса календаря стане доступною в домашній мережі без пароля. Саме посилання і є паролем. Ніколи не прокидайте порт через роутер; для доступу ззовні використовуйте зворотний проксі з HTTPS або VPN."
configuration:
  passphrase:
    name: Кодова фраза
    description: Шифрує збережені дані входу та ключ двофакторної автентифікації цією фразою замість постійного ключа на диску. Без неї будь-хто з копією резервної копії може прочитати секрети.
