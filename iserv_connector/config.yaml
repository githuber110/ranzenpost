name: Ranzenpost (IServ)
version: "2610.6.0"
slug: ranzenpost
description: A parent frontend for IServ school servers. Timetable with substitutions, letters, noticeboards, absences, chat and school events.
url: https://github.com/githuber110/ranzenpost
image: ghcr.io/githuber110/ranzenpost
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
watchdog: http://[HOST]:[PORT:8099]/api/ping
homeassistant_api: true
hassio_api: true
discovery: [ranzenpost]
panel_icon: mdi:school
panel_title: Ranzenpost
panel_admin: false
ports:
  8100/tcp: null
backup_exclude:
  - "**/log/*"
options:
  passphrase: ""
schema:
  passphrase: password?
