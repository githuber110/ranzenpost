name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: meta
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' iserv_connector/config.yaml)"
          if [ -z "$version" ]; then
            echo "version missing in iserv_connector/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [ "$tag" != "${{ steps.meta.outputs.version }}" ]; then
            echo "tag v$tag does not match config.yaml version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/ranzenpost:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/ranzenpost:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: meta
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' iserv_connector/config.yaml)"
          if [ -z "$version" ]; then
            echo "version missing in iserv_connector/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract the release notes from the changelog
        run: |
          python3 scripts/extract_changelog_section.py "${{ steps.meta.outputs.version }}" > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists, skipping"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "${{ steps.meta.outputs.version }}" --notes-file release-notes.md
          fi

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r backend/requirements.lock.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: node scripts/run-frontend-tests.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-integration-dev.txt
      - run: pytest tests/components/ranzenpost -q -p no:cacheprovider
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run test:card

  image-smoke:
    runs-on: ubuntu-latest
    needs: [tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ranzenpost:smoke

      - name: Start the image and wait for its health endpoint
        run: |
          docker run -d --name ranzenpost-smoke -p 8099:8099 ranzenpost:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8099/api/health >/dev/null; then
              echo "container answers /api/health"
              exit 0
            fi
            sleep 1
          done
          echo "container never answered /api/health" >&2
          exit 1

      - name: Show the container's log on failure
        if: failure()
        run: docker logs ranzenpost-smoke

      - name: Stop the container
        if: always()
        run: docker rm -f ranzenpost-smoke || true
